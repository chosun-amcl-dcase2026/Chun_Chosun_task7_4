# System information
system:
  description:
    # Data augmentation methods
    # task7_3와 동일하되 gain 증강만 baby_cry/telephone_ringing 2개 클래스 제외(COND off)
    data_augmentation: mixup, gain augmentation (off for baby_cry and telephone_ringing), spec augmentation, balanced sampling

    # How the system handles catastrophic forgetting
    catastrophic_forgetting_handling: covariance protection (CovForget), forgetting regularization, orthogonal gradient projection, null-space lora, distillation, ensemble

    # Does the system explicitly predict the domain? (true/false)
    domain_specific_components: false

  # URL to the source code of the system
  source_code: https://github.com/chosun-amcl-dcase2026/Chun_Chosun_task7_4

